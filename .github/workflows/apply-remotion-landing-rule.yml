name: Apply Remotion landing rule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-remotion-landing-rule.yml'

permissions:
  contents: write

jobs:
  update-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch SKILL.md
        run: python .github/scripts/apply-remotion-landing-rule.py
      - name: Commit changes and remove temporary files
        run: |
          rm -f .github/scripts/apply-remotion-landing-rule.py .github/workflows/apply-remotion-landing-rule.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: allow Remotion media inside landing pages [skip ci]"
          git push
