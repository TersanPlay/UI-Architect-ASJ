name: Apply modern controls rule

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-modern-controls-rule.yml

permissions:
  contents: write

jobs:
  update-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch SKILL.md
        run: python .github/scripts/apply_modern_controls_rule.py

      - name: Remove temporary files
        run: |
          git rm .github/workflows/apply-modern-controls-rule.yml
          git rm .github/scripts/apply_modern_controls_rule.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKILL.md
          git commit -m "feat: require modern accessible form controls"
          git push origin HEAD:main
